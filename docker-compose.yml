version: '3.8'

services:
  # Database
  mongodb:
    image: mongo:6.0
    container_name: social_media_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  # Cache
  redis:
    image: redis:7-alpine
    container_name: social_media_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Redis UI (RedisInsight)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: social_media_redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis

  # Kafka Message Broker (KRaft Mode - No ZooKeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: social_media_kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft Configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # HTTP API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_media_api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
      - kafka
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/social_media
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_ACCESS_SECRET: supersecretaccesskey12345
      JWT_REFRESH_SECRET: supersecretrefreshkey12345
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

  # Background Consumer Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_media_worker
    depends_on:
      - mongodb
      - redis
      - kafka
    command: ["node", "dist/worker.js"]
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/social_media
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_ACCESS_SECRET: supersecretaccesskey12345
      JWT_REFRESH_SECRET: supersecretrefreshkey12345
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

volumes:
  mongodb_data:
  redis_data:
  redisinsight_data:
